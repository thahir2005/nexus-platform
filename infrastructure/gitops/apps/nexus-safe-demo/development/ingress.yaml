apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexus-safe-demo
  namespace: nexus
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexus-nexus-safe-demo
                port:
                  number: 8000
